name: Update LeetCode README

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "scripts/topics_cache.json"

permissions:
  contents: write

concurrency:
  group: update-leetcode-readme
  cancel-in-progress: false

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate README
        run: python scripts/generate_readme.py

      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md scripts/topics_cache.json

          if git diff --cached --quiet; then
            echo "README and topic cache are already up to date."
            exit 0
          fi

          git commit -m "docs: automatically update LeetCode README"
          git pull --rebase origin main
          git push origin main