name: Update LeetCode README

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'scripts/topics_cache.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate, commit and push README
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAX_RETRIES=5
          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i: Fetching latest $BRANCH_NAME..."
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
            git reset --hard "origin/$BRANCH_NAME"

            echo "Generating updated README.md..."
            python scripts/generate_readme.py

            git add README.md scripts/topics_cache.json

            if git diff --cached --quiet; then
              echo "No README changes detected. Everything is up to date."
              exit 0
            fi

            git commit -m "docs: automatically update LeetCode README [skip ci]"

            if git push origin "$BRANCH_NAME"; then
              echo "Successfully pushed updated README."
              exit 0
            else
              echo "Push failed (remote received new commits). Retrying in 2 seconds..."
              sleep 2
            fi
          done

          echo "Error: Failed to push after $MAX_RETRIES attempts."
          exit 1
