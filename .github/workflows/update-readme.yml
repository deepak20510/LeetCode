name: Update LeetCode README

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - scripts/topics_cache.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README
        run: |
          python scripts/generate_readme.py

      - name: Check for generated file changes
        id: changes
        run: |
          if git diff --quiet -- README.md scripts/topics_cache.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated files
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md scripts/topics_cache.json
          git commit -m "docs: automatically update LeetCode README"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"
